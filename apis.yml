name: FirstCry
description: 'FirstCry (operated by Brainbees Solutions Ltd) is India''s largest omnichannel
  retailer of baby, kids, and maternity products, founded in 2010 by Supam Maheshwari
  and Amitava Saha and headquartered in Pune, India. It sells apparel, footwear, toys,
  diapers, feeding and nursery gear, and personal-care products across its website,
  mobile apps, and a large network of physical stores, alongside in-house brands such
  as BabyHug. The company is backed by SoftBank Vision Fund and listed publicly on the
  NSE and BSE in 2024. FirstCry publishes no public developer API or developer portal;
  this profile captures the company''s public web, policy, and security-disclosure
  surface for the API Evangelist network.'
